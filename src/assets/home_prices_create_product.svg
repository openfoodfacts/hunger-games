<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="pcOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="pcPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="pcBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="pcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.12" />
    </filter>
    <filter id="pcPlusShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="350" height="200" rx="16" fill="url(#pcBgGrad)" />

  <!-- Supermarket Receipt in background (angled left) -->
  <g transform="translate(42, 28) rotate(-6)" filter="url(#pcShadow)">
    <rect width="110" height="146" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2" />
    <rect x="12" y="14" width="86" height="6" rx="3" fill="#cbd5e1" />
    <rect x="12" y="26" width="60" height="4" rx="2" fill="#e2e8f0" />
    <rect x="12" y="34" width="75" height="4" rx="2" fill="#e2e8f0" />
    <rect x="12" y="42" width="68" height="4" rx="2" fill="#e2e8f0" />
    <!-- Unknown Product Question Line -->
    <rect x="8" y="54" width="94" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
    <text x="55" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#dc2626" text-anchor="middle">MISSING PRODUCT ?</text>
    <!-- Price -->
    <text x="55" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#475569" text-anchor="middle">2.99 €</text>
  </g>

  <!-- Scan / Transition Arrow -->
  <g transform="translate(150, 92)">
    <path d="M0 0 L24 0 M16 -8 L24 0 L16 8" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 3D Product Box Creation Container (Right) -->
  <g transform="translate(186, 24)" filter="url(#pcShadow)">
    <!-- Main Product Card Base -->
    <rect width="124" height="152" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" />

    <!-- Isometric Package Box -->
    <g transform="translate(24, 20)">
      <!-- Box Top Face -->
      <polygon points="38,0 76,14 38,28 0,14" fill="#fde68a" />
      <!-- Box Left Face -->
      <polygon points="0,14 38,28 38,72 0,58" fill="url(#pcBoxGrad)" />
      <!-- Box Right Face -->
      <polygon points="38,28 76,14 76,58 38,72" fill="#d97706" />

      <!-- Barcode on Box side -->
      <g transform="translate(8, 34) skewY(20)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#ffffff" stroke-width="1.5" />
        <line x1="3" y1="0" x2="3" y2="12" stroke="#ffffff" stroke-width="0.8" />
        <line x1="6" y1="0" x2="6" y2="12" stroke="#ffffff" stroke-width="2" />
        <line x1="11" y1="0" x2="11" y2="12" stroke="#ffffff" stroke-width="1.2" />
        <line x1="16" y1="0" x2="16" y2="12" stroke="#ffffff" stroke-width="2.5" />
      </g>
    </g>

    <!-- Scanner Laser Beam Line -->
    <line x1="16" y1="62" x2="108" y2="62" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2" />

    <!-- Label Below Box -->
    <rect x="14" y="106" width="96" height="18" rx="9" fill="#ffedd5" />
    <text x="62" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#c2410c" text-anchor="middle">ADD TO FOOD FACTS</text>

    <!-- Source Tag: Open Prices -->
    <text x="62" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#7c3aed" text-anchor="middle">Via Open Prices</text>
  </g>

  <!-- Big Glowing Plus (+) Badge Icon -->
  <g transform="translate(268, 16)" filter="url(#pcPlusShadow)">
    <circle cx="20" cy="20" r="20" fill="url(#pcOrange)" />
    <!-- Plus symbol -->
    <line x1="10" y1="20" x2="30" y2="20" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="10" x2="20" y2="30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Sparkles & Discovery Elements -->
  <polygon points="174,18 178,26 186,30 178,34 174,42 170,34 162,30 170,26" fill="#f59e0b" opacity="0.8" />
  <circle cx="24" cy="40" r="3" fill="#f97316" opacity="0.4" />
  <circle cx="328" cy="172" r="3" fill="#fbbf24" opacity="0.5" />
</svg>
