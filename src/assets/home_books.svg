<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="100%" height="100%">
  <!-- Background Base Container -->
  <rect width="350" height="200" rx="16" fill="#F8F9FA" />

  <!-- Main Card Surface -->
  <rect x="12" y="10" width="326" height="180" rx="14" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.2" />

  <!-- Top Accent Bar (Open Products Facts Blue) -->
  <path d="M 12 24 A 14 14 0 0 1 26 10 L 324 10 A 14 14 0 0 1 338 24 L 338 26 L 12 26 Z" fill="#0064C8" />

  <!-- Sub-brand Tag Badge -->
  <rect x="156" y="16" width="170" height="18" rx="9" fill="#EDF5FD" />
  <text x="241" y="29" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="700" fill="#0064C8" text-anchor="middle" letter-spacing="0.5">OPEN PRODUCTS FACTS • BOOKS</text>

  <!-- Left: Official Open Products Facts Emblem -->
  <g transform="translate(16, 42) scale(0.38)">
    <rect x="20" y="50" width="220" height="50" rx="10" fill="#0064C8" transform="rotate(-5, 130, 75)" />
    <text x="130" y="84" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" transform="rotate(-5, 130, 75)">PRODUCTS</text>
  </g>

  <!-- Book Migration Illustration -->
  <g transform="translate(130, 48)">
    <!-- Book 1 (Tilted Blue Book) -->
    <g transform="rotate(-8, 30, 90)">
      <rect x="20" y="20" width="46" height="84" rx="4" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" />
      <rect x="24" y="20" width="6" height="84" fill="#1E40AF" />
      <line x1="38" y1="36" x2="58" y2="36" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
      <line x1="38" y1="44" x2="54" y2="44" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" />
      <text x="48" y="80" font-family="monospace" font-size="6" font-weight="bold" fill="#DBEAFE" text-anchor="middle">978</text>
    </g>

    <!-- Book 2 (Center Orange Book) -->
    <g transform="translate(56, 12)">
      <rect x="10" y="14" width="52" height="90" rx="4" fill="#F97316" stroke="#EA580C" stroke-width="1.5" />
      <rect x="14" y="14" width="7" height="90" fill="#C2410C" />
      <rect x="28" y="26" width="28" height="34" rx="2" fill="#FED7AA" />
      <line x1="32" y1="36" x2="52" y2="36" stroke="#9A3412" stroke-width="1.5" stroke-linecap="round" />
      <line x1="32" y1="44" x2="48" y2="44" stroke="#9A3412" stroke-width="1.5" stroke-linecap="round" />
      <line x1="32" y1="52" x2="44" y2="52" stroke="#9A3412" stroke-width="1.5" stroke-linecap="round" />
      <text x="36" y="88" font-family="monospace" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">979</text>
    </g>

    <!-- Book 3 (Right Green Book) -->
    <g transform="rotate(7, 130, 90) translate(92, 18)">
      <rect x="10" y="16" width="48" height="86" rx="4" fill="#10B981" stroke="#047857" stroke-width="1.5" />
      <rect x="14" y="16" width="6" height="86" fill="#047857" />
      <line x1="28" y1="34" x2="50" y2="34" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" />
      <line x1="28" y1="42" x2="46" y2="42" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round" />
      <text x="36" y="78" font-family="monospace" font-size="6.5" font-weight="bold" fill="#ECFDF5" text-anchor="middle">ISBN</text>
    </g>

    <!-- Migration arrow towards Open Products Facts -->
    <g transform="translate(150, 60)">
      <circle cx="14" cy="14" r="15" fill="#0064C8" />
      <path d="M 9 14 L 17 14 M 14 10 L 18 14 L 14 18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom Badges / Barcode indicator -->
  <g transform="translate(24, 150)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#374151">978 • 979 EANs</text>

    <rect x="140" y="0" width="164" height="24" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="150" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#065F46">→ Move to Open Products</text>
  </g>
</svg>
