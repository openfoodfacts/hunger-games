<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="gsGreenA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="gsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14532d" flood-opacity="0.1" />
    </filter>
    <filter id="gsBadgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#166534" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="350" height="200" rx="16" fill="url(#gsBgGrad)" />

  <!-- Main Card Container -->
  <g filter="url(#gsShadow)">
    <rect x="36" y="20" width="278" height="160" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
  </g>

  <!-- Header Banner -->
  <rect x="36" y="20" width="278" height="34" rx="14" fill="#f0fdf4" />
  <rect x="36" y="40" width="278" height="14" fill="#f0fdf4" />
  <line x1="36" y1="54" x2="314" y2="54" stroke="#dcfce7" stroke-width="1" />

  <g transform="translate(52, 28)">
    <rect width="20" height="18" rx="5" fill="url(#gsGreenA)" />
    <!-- Leaf icon -->
    <path d="M10 4 C6 4 5 7 10 13 C15 7 14 4 10 4 Z" fill="#ffffff" />
    <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Green-Score Environmental Impact</text>

    <!-- Tag -->
    <rect x="180" y="2" width="68" height="16" rx="8" fill="#dcfce7" />
    <text x="214" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">ECO-SCORE</text>
  </g>

  <!-- Green-Score A to E Indicator Spectrum -->
  <g transform="translate(56, 76)">
    <!-- Spectrum Bars -->
    <!-- A (Highlighted/Selected) -->
    <g transform="translate(0, -8)" filter="url(#gsBadgeShadow)">
      <rect width="46" height="66" rx="10" fill="#15803d" stroke="#ffffff" stroke-width="2" />
      <text x="23" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
      <!-- Leaf on A -->
      <path d="M23 42 C18 42 17 45 23 50 C29 45 28 42 23 42 Z" fill="#bbf7d0" />
      <text x="23" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="800" fill="#dcfce7" text-anchor="middle">LOW IMPACT</text>
    </g>

    <!-- B -->
    <g transform="translate(50, 4)">
      <rect width="42" height="50" rx="8" fill="#22c55e" opacity="0.8" />
      <text x="21" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
    </g>

    <!-- C -->
    <g transform="translate(96, 4)">
      <rect width="42" height="50" rx="8" fill="#eab308" opacity="0.8" />
      <text x="21" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
    </g>

    <!-- D -->
    <g transform="translate(142, 4)">
      <rect width="42" height="50" rx="8" fill="#f97316" opacity="0.8" />
      <text x="21" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
    </g>

    <!-- E -->
    <g transform="translate(188, 4)">
      <rect width="42" height="50" rx="8" fill="#ef4444" opacity="0.8" />
      <text x="21" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Decorative Sparkles -->
  <circle cx="24" cy="40" r="3" fill="#15803d" opacity="0.4" />
  <circle cx="328" cy="168" r="4" fill="#22c55e" opacity="0.5" />
</svg>
