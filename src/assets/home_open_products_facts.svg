<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="100%" height="100%">
  <defs>
    <linearGradient id="opBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="opBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="opSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="opAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="opShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
    <filter id="opBadgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="350" height="200" rx="16" fill="url(#opBgGrad)" />

  <!-- Main Card Container -->
  <g filter="url(#opShadow)">
    <rect x="36" y="20" width="278" height="160" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Header Banner -->
  <rect x="36" y="20" width="278" height="34" rx="14" fill="#f8fafc" />
  <rect x="36" y="40" width="278" height="14" fill="#f8fafc" />
  <line x1="36" y1="54" x2="314" y2="54" stroke="#e2e8f0" stroke-width="1" />

  <g transform="translate(52, 28)">
    <rect width="20" height="18" rx="5" fill="url(#opBlue)" />
    <!-- Shopping Bag / Box icon -->
    <path d="M6 7 H14 L15 15 H5 Z M8 7 V5 C8 4 9 3 10 3 C11 3 12 4 12 5 V7" fill="none" stroke="#ffffff" stroke-width="1.3" />
    <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Open Products Facts</text>

    <!-- Sister Project Tag -->
    <rect x="174" y="2" width="74" height="16" rx="8" fill="#e0f2fe" />
    <text x="211" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0284c7" text-anchor="middle">NON-FOOD</text>
  </g>

  <!-- Non-food Items Lineup -->
  <g transform="translate(54, 62)">
    <!-- 1. Cleaning Spray Bottle (Detergent / Household) -->
    <g transform="translate(10, 2)">
      <!-- Spray Trigger Mechanism -->
      <path d="M12 12 H26 V4 H12 Z M26 8 H32 V12 H26 Z M18 12 L14 20" fill="#0284c7" stroke="#0369a1" stroke-width="0.8" />
      <rect x="15" y="16" width="8" height="8" fill="#94a3b8" />
      <!-- Bottle Body -->
      <path d="M15 24 C10 28 8 36 8 46 L8 76 C8 78 12 80 19 80 C26 80 30 78 30 76 L30 46 C30 36 28 28 23 24 Z" fill="url(#opBlue)" opacity="0.85" />
      <!-- Clean Sparkle on bottle -->
      <circle cx="19" cy="52" r="5" fill="#ffffff" opacity="0.9" />
      <polygon points="19,46 20,50 24,52 20,54 19,58 18,54 14,52 18,50" fill="#0284c7" />
    </g>

    <!-- 2. Hardcover Book (Culture / Media) -->
    <g transform="translate(68, 18)">
      <!-- Book spine & cover -->
      <rect x="0" y="0" width="38" height="58" rx="4" fill="url(#opSlate)" />
      <rect x="4" y="2" width="32" height="54" rx="2" fill="#f8fafc" />
      <line x1="10" y1="12" x2="30" y2="12" stroke="#0284c7" stroke-width="2" />
      <line x1="10" y1="20" x2="26" y2="20" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="10" y1="26" x2="28" y2="26" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="10" y1="32" x2="24" y2="32" stroke="#cbd5e1" stroke-width="1.5" />
      <circle cx="20" cy="44" r="4" fill="#fbbf24" />
    </g>

    <!-- 3. Ceramic Coffee Mug (Home Goods) -->
    <g transform="translate(122, 26)">
      <!-- Mug Body -->
      <rect x="0" y="0" width="32" height="42" rx="4" fill="url(#opAmber)" />
      <!-- Mug Handle -->
      <path d="M32 8 C40 8 40 28 32 28" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
      <!-- Steam curls -->
      <path d="M10 -6 Q8 -2 10 2" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
      <path d="M18 -8 Q16 -3 18 2" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- 4. Target Project Badge (Right) -->
    <g transform="translate(178, 6)" filter="url(#opBadgeShadow)">
      <circle cx="26" cy="26" r="24" fill="url(#opBlue)" />
      <!-- Cube / Merchandise Icon -->
      <path d="M16 22 L26 16 L36 22 L26 28 Z M16 24 L26 30 V40 L16 34 Z M36 24 L26 30 V40 L36 34 Z" fill="#ffffff" />
      <!-- Move Pill Below -->
      <g transform="translate(2, 60)">
        <rect width="48" height="22" rx="11" fill="url(#opSlate)" />
        <text x="24" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle">MOVE ➔</text>
      </g>
    </g>
  </g>

  <!-- Decorative Sparkles -->
  <circle cx="24" cy="38" r="3" fill="#0284c7" opacity="0.4" />
  <circle cx="328" cy="168" r="4" fill="#64748b" opacity="0.5" />
</svg>
