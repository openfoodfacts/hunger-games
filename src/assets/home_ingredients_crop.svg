<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="100%" height="100%">
  <!-- Background Base Container -->
  <rect width="350" height="200" rx="16" fill="#F8F9FA" />

  <!-- Main Card Surface -->
  <rect x="12" y="10" width="326" height="180" rx="14" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.2" />

  <!-- Top Accent Bar (Open Food Facts Orange) -->
  <path d="M 12 24 A 14 14 0 0 1 26 10 L 324 10 A 14 14 0 0 1 338 24 L 338 26 L 12 26 Z" fill="#FF8714" />

  <!-- Badge Top Right -->
  <rect x="180" y="16" width="146" height="18" rx="9" fill="#FFF4E8" />
  <text x="253" y="29" font-family="Plus Jakarta Sans, sans-serif" font-size="8.5" font-weight="700" fill="#FF8714" text-anchor="middle" letter-spacing="0.5">CADRAGE D'INGRÉDIENTS</text>

  <!-- Packaging Photo Background with Cropping Overlay -->
  <g transform="translate(24, 42)">
    <!-- Package Photo Canvas -->
    <rect width="302" height="134" rx="10" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1" />

    <!-- Distant packaging text placeholders -->
    <rect x="16" y="12" width="60" height="6" rx="2" fill="#D1D5DB" />
    <rect x="16" y="24" width="80" height="5" rx="2" fill="#E5E7EB" />
    <rect x="16" y="34" width="70" height="5" rx="2" fill="#E5E7EB" />

    <!-- Active Crop Area Box with Orange Corners -->
    <g transform="translate(36, 12)">
      <!-- Transparent Mask Cutout -->
      <rect width="230" height="90" fill="#FFFFFF" stroke="#FF8714" stroke-width="1.5" />

      <!-- Rule-of-Thirds Grid Lines -->
      <line x1="76" y1="0" x2="76" y2="90" stroke="#FF8714" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="153" y1="0" x2="153" y2="90" stroke="#FF8714" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="0" y1="30" x2="230" y2="30" stroke="#FF8714" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="0" y1="60" x2="230" y2="60" stroke="#FF8714" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

      <!-- 4 Corner Crop Markers in OFF Orange -->
      <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#FF8714" stroke-width="3.5" />
      <path d="M 214 0 L 230 0 L 230 16" fill="none" stroke="#FF8714" stroke-width="3.5" />
      <path d="M 0 74 L 0 90 L 16 90" fill="none" stroke="#FF8714" stroke-width="3.5" />
      <path d="M 214 90 L 230 90 L 230 74" fill="none" stroke="#FF8714" stroke-width="3.5" />

      <!-- Real Ingredients Text Inside Crop Box -->
      <text x="14" y="20" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#111827">Ingrédients :</text>
      <text x="14" y="36" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="500" fill="#374151">Farine de blé 68%, eau, sucre, huile de colza,</text>
      <text x="14" y="50" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="500" fill="#374151">levure, arôme naturel, sel, gluten de blé,</text>
      <text x="14" y="64" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="500" fill="#374151">conservateur : propionate de calcium.</text>
      <text x="14" y="78" font-family="Plus Jakarta Sans, sans-serif" font-size="7.5" font-weight="600" fill="#00A05A">Zone de texte détectée avec précision ✓</text>
    </g>

    <!-- Validate Crop Action Tag Button -->
    <g transform="translate(86, 106)">
      <rect width="130" height="22" rx="11" fill="#FF8714" />
      <text x="65" y="15" font-family="Plus Jakarta Sans, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Valider le cadrage ✓</text>
    </g>
  </g>
</svg>