<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="100%" height="100%">
  <defs>
    <linearGradient id="obBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <linearGradient id="obPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="obFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="obViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="obShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#831843" flood-opacity="0.12" />
    </filter>
    <filter id="obBadgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#9d174d" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="350" height="200" rx="16" fill="url(#obBgGrad)" />

  <!-- Main Card Container -->
  <g filter="url(#obShadow)">
    <rect x="36" y="20" width="278" height="160" rx="14" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5" />
  </g>

  <!-- Header Banner -->
  <rect x="36" y="20" width="278" height="34" rx="14" fill="#fdf2f8" />
  <rect x="36" y="40" width="278" height="14" fill="#fdf2f8" />
  <line x1="36" y1="54" x2="314" y2="54" stroke="#fce7f3" stroke-width="1" />

  <g transform="translate(52, 28)">
    <rect width="20" height="18" rx="5" fill="url(#obFuchsia)" />
    <!-- Flower / Cosmetics icon -->
    <circle cx="10" cy="9" r="4" fill="#ffffff" />
    <circle cx="10" cy="9" r="2" fill="#be185d" />
    <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Open Beauty Facts</text>

    <!-- Sister Project Tag -->
    <rect x="174" y="2" width="74" height="16" rx="8" fill="#fce7f3" />
    <text x="211" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#db2777" text-anchor="middle">COSMETICS</text>
  </g>

  <!-- Cosmetics Lineup -->
  <g transform="translate(58, 62)">
    <!-- 1. Lotion Pump Dispenser Bottle (Left) -->
    <g transform="translate(14, 8)">
      <!-- Pump Head -->
      <path d="M14 4 H28 V0 H14 Z M28 2 H38 V6 H28 Z" fill="#64748b" />
      <rect x="18" y="4" width="6" height="10" fill="#94a3b8" />
      <rect x="15" y="14" width="12" height="6" rx="2" fill="#cbd5e1" />
      <!-- Bottle Body -->
      <rect x="6" y="20" width="30" height="58" rx="8" fill="url(#obFuchsia)" opacity="0.9" />
      <rect x="11" y="34" width="20" height="26" rx="3" fill="#ffffff" opacity="0.95" />
      <!-- Label lines -->
      <line x1="14" y1="42" x2="28" y2="42" stroke="#db2777" stroke-width="1.5" />
      <line x1="15" y1="48" x2="27" y2="48" stroke="#f472b6" stroke-width="1" />
      <line x1="16" y1="52" x2="26" y2="52" stroke="#f472b6" stroke-width="1" />
    </g>

    <!-- 2. Elegant Perfume Flacon (Center Elevated) -->
    <g transform="translate(72, 0)" filter="url(#obBadgeShadow)">
      <!-- Spray Atomizer nozzle -->
      <rect x="22" y="4" width="8" height="12" rx="2" fill="#fbbf24" stroke="#d97706" stroke-width="0.8" />
      <!-- Glass Flacon -->
      <rect x="8" y="16" width="36" height="48" rx="10" fill="#ffffff" stroke="#ec4899" stroke-width="1.5" />
      <!-- Golden Fragrance Liquid inside -->
      <rect x="12" y="24" width="28" height="36" rx="6" fill="url(#obPink)" opacity="0.75" />
      <!-- Perfume label badge -->
      <circle cx="26" cy="42" r="9" fill="#ffffff" stroke="#f43f5e" stroke-width="1" />
      <text x="26" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#e11d48" text-anchor="middle">OBF</text>
      <!-- Base Reflection -->
      <ellipse cx="26" cy="68" rx="24" ry="4" fill="#fbcfe8" opacity="0.6" />
    </g>

    <!-- 3. Tube of Cream / Balm (Right) -->
    <g transform="translate(136, 12)">
      <!-- Tube crimped top -->
      <polygon points="0,0 26,0 23,60 3,60" fill="url(#obViolet)" opacity="0.85" />
      <rect x="0" y="0" width="26" height="5" rx="1" fill="#7e22ce" />
      <!-- Cap at bottom -->
      <rect x="6" y="60" width="14" height="12" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
      <!-- Leaf on tube -->
      <circle cx="13" cy="28" r="6" fill="#ffffff" opacity="0.9" />
      <path d="M13 24 C10 24 9 27 13 31 C17 27 16 24 13 24 Z" fill="#9333ea" />
    </g>

    <!-- Move Arrow & Target Project Badge (Far Right) -->
    <g transform="translate(182, 16)" filter="url(#obBadgeShadow)">
      <!-- Transition arrow icon -->
      <g transform="translate(6, 6)">
        <circle cx="16" cy="16" r="16" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5" />
        <path d="M10 16 H22 M17 11 L22 16 L17 21" stroke="#db2777" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
      <!-- Dispatch Pill -->
      <g transform="translate(0, 48)">
        <rect width="48" height="22" rx="11" fill="url(#obFuchsia)" />
        <text x="24" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle">MOVE ➔</text>
      </g>
    </g>
  </g>

  <!-- Decorative Sparkles -->
  <polygon points="46,60 48,64 52,66 48,68 46,72 44,68 40,66 44,64" fill="#f43f5e" opacity="0.6" />
  <polygon points="296,80 298,84 302,86 298,88 296,92 294,88 290,86 294,84" fill="#ec4899" opacity="0.6" />
  <circle cx="26" cy="38" r="3" fill="#f43f5e" opacity="0.4" />
  <circle cx="328" cy="168" r="4" fill="#db2777" opacity="0.5" />
</svg>
