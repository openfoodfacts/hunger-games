<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="pkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="pkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pkAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="pkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#075985" flood-opacity="0.1" />
    </filter>
    <filter id="pkBadgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#064e3b" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="350" height="200" rx="16" fill="url(#pkBgGrad)" />

  <!-- Main Card Container -->
  <g filter="url(#pkShadow)">
    <rect x="36" y="20" width="278" height="160" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
  </g>

  <!-- Header Banner -->
  <rect x="36" y="20" width="278" height="34" rx="14" fill="#f8fafc" />
  <rect x="36" y="40" width="278" height="14" fill="#f8fafc" />
  <line x1="36" y1="54" x2="314" y2="54" stroke="#f1f5f9" stroke-width="1" />

  <g transform="translate(52, 28)">
    <rect width="20" height="18" rx="5" fill="url(#pkBlue)" />
    <!-- Box icon inside small rect -->
    <path d="M5 6 L10 3 L15 6 L10 9 Z M5 7 L10 10 L10 15 L5 12 Z M15 7 L10 10 L10 15 L15 12 Z" fill="#ffffff" />
    <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Packaging & Materials</text>

    <!-- Question Tag -->
    <rect x="178" y="2" width="70" height="16" rx="8" fill="#e0f2fe" />
    <text x="213" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0284c7" text-anchor="middle">PACKAGING</text>
  </g>

  <!-- Packaging Shapes Lineup -->
  <g transform="translate(52, 68)">
    <!-- 1. Beverage Can (Aluminum) -->
    <g transform="translate(10, 16)">
      <!-- Can Body -->
      <rect x="0" y="8" width="34" height="60" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
      <ellipse cx="17" cy="8" rx="17" ry="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <ellipse cx="17" cy="68" rx="17" ry="4" fill="#94a3b8" />
      <!-- Pull tab -->
      <ellipse cx="17" cy="8" rx="6" ry="2" fill="#64748b" />
      <!-- Stripe -->
      <rect x="0" y="26" width="34" height="18" fill="url(#pkBlue)" opacity="0.85" />
      <text x="17" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle">CAN</text>
    </g>

    <!-- 2. Glass Bottle (Glass) -->
    <g transform="translate(68, 6)">
      <!-- Bottle neck -->
      <rect x="10" y="0" width="10" height="18" rx="2" fill="#a7f3d0" stroke="#34d399" stroke-width="1" />
      <!-- Bottle body -->
      <path d="M10 18 C10 26 0 28 0 38 L0 72 C0 75 4 78 15 78 C26 78 30 75 30 72 L30 38 C30 28 20 26 20 18 Z" fill="#6ee7b7" stroke="#10b981" stroke-width="1.2" opacity="0.8" />
      <!-- Label -->
      <rect x="4" y="40" width="22" height="22" rx="3" fill="#ffffff" opacity="0.9" />
      <text x="15" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" fill="#047857" text-anchor="middle">GLASS</text>
    </g>

    <!-- 3. Tetra Pak / Juice Carton (Cardboard) -->
    <g transform="translate(122, 10)">
      <!-- Gable top -->
      <polygon points="0,16 20,0 40,16" fill="#fde68a" stroke="#d97706" stroke-width="1" />
      <polygon points="20,0 40,16 48,10 28,-4" fill="#f59e0b" />
      <!-- Carton body -->
      <rect x="0" y="16" width="40" height="62" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
      <!-- Cap -->
      <ellipse cx="20" cy="8" rx="5" ry="3" fill="#ef4444" />
      <rect x="6" y="34" width="28" height="24" rx="2" fill="#ffffff" opacity="0.9" />
      <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="800" fill="#b45309" text-anchor="middle">CARTON</text>
    </g>

    <!-- 4. Recycling Möbius Loop Badge (Prominent on Right) -->
    <g transform="translate(186, 6)" filter="url(#pkBadgeShadow)">
      <circle cx="28" cy="28" r="26" fill="url(#pkGreen)" />
      <!-- Möbius 3 recycling arrows -->
      <g transform="translate(28, 28) scale(1.1)">
        <!-- Arrow 1 (Top) -->
        <path d="M-8 -12 L4 -12 L1 -15 M4 -12 L1 -9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Arrow 2 (Right to Bottom) -->
        <path d="M12 -4 L7 10 L5 6 M7 10 L11 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Arrow 3 (Bottom to Left) -->
        <path d="M-4 10 L-12 -2 L-8 -2 M-12 -2 L-13 3" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <!-- "RECYCLE" Label -->
      <rect x="2" y="60" width="52" height="16" rx="8" fill="#dcfce7" />
      <text x="28" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" fill="#15803d" text-anchor="middle">RECYCLING</text>
    </g>
  </g>

  <!-- Decorative Sparkles -->
  <circle cx="24" cy="40" r="3" fill="#0284c7" opacity="0.4" />
  <circle cx="328" cy="168" r="4" fill="#10b981" opacity="0.5" />
</svg>
