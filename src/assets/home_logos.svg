<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="shadowL" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1c1917" flood-opacity="0.1" />
    </filter>
    <filter id="badgeShadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="350" height="200" rx="16" fill="url(#bgGradL)" />

  <!-- Logo Stash / Badge Collection Grid -->
  <g filter="url(#shadowL)">

    <!-- Card 1: Organic / Bio Leaf Badge (Left rotated) -->
    <g transform="translate(48, 42) rotate(-8)">
      <rect width="90" height="110" rx="14" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" filter="url(#badgeShadowL)" />
      <!-- Top banner ribbon -->
      <rect x="0" y="0" width="90" height="28" rx="14" fill="url(#bioGrad)" />
      <rect x="0" y="14" width="90" height="14" fill="url(#bioGrad)" />
      <text x="45" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ORGANIC</text>
      <!-- Leaf emblem icon -->
      <circle cx="45" cy="62" r="20" fill="#ecfdf5" />
      <path d="M45 48 C34 48 32 60 45 74 C58 60 56 48 45 48 Z" fill="url(#bioGrad)" />
      <path d="M45 52 L45 70" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <!-- Star ratings below -->
      <text x="45" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">★ BIO ★</text>
    </g>

    <!-- Card 2: Quality Seal / Verified Badge (Center elevated) -->
    <g transform="translate(130, 24)">
      <rect width="96" height="125" rx="14" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" filter="url(#badgeShadowL)" />
      <!-- Top banner ribbon -->
      <rect x="0" y="0" width="96" height="30" rx="14" fill="url(#indigoGrad)" />
      <rect x="0" y="15" width="96" height="15" fill="url(#indigoGrad)" />
      <text x="48" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">VERIFIED</text>
      <!-- Seal Emblem -->
      <circle cx="48" cy="68" r="22" fill="url(#amberGrad)" />
      <circle cx="48" cy="68" r="18" fill="#ffffff" />
      <!-- Checkmark in Seal -->
      <path d="M40 68 L46 74 L57 61" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Bottom Badge label -->
      <rect x="16" y="98" width="64" height="16" rx="8" fill="#e0e7ff" />
      <text x="48" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#3730a3" text-anchor="middle">CERTIFIED</text>
    </g>

    <!-- Card 3: Brand Label Tag (Right rotated) -->
    <g transform="translate(216, 46) rotate(10)">
      <rect width="86" height="106" rx="14" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" filter="url(#badgeShadowL)" />
      <!-- Top banner ribbon -->
      <rect x="0" y="0" width="86" height="26" rx="14" fill="url(#orangeGrad)" />
      <rect x="0" y="13" width="86" height="13" fill="url(#orangeGrad)" />
      <text x="43" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">FAIR TRADE</text>
      <!-- Globe / Handshake Symbol -->
      <circle cx="43" cy="58" r="18" fill="#fff7ed" />
      <circle cx="43" cy="58" r="12" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4 2" />
      <path d="M36 58 H50 M43 51 V65" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" />
      <!-- Tag label -->
      <text x="43" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#c2410c" text-anchor="middle">QUALITY</text>
    </g>

  </g>

  <!-- Magnifying Glass / Search Focus Icon -->
  <g transform="translate(230, 110)" filter="url(#badgeShadowL)">
    <circle cx="30" cy="30" r="20" fill="#ffffff" stroke="#3b82f6" stroke-width="4" />
    <line x1="44" y1="44" x2="60" y2="60" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" />
    <circle cx="24" cy="24" r="5" fill="#93c5fd" opacity="0.6" />
  </g>

  <!-- Decorative Sparkles -->
  <circle cx="30" cy="30" r="3" fill="#6366f1" opacity="0.4" />
  <circle cx="320" cy="35" r="4" fill="#10b981" opacity="0.4" />
  <circle cx="28" cy="165" r="5" fill="#f59e0b" opacity="0.3" />
</svg>
